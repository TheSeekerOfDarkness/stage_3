# Local single-machine development & smoke-test stack for Design B (Hazelcast In-Memory Index).
# NOTE: Running multiple containers on one host is for functional smoke testing only;
# cluster benchmarks and fault-tolerance evaluations must use separate physical lab hosts
# via docker-compose.lab-worker.yml (or run_worker.sh).

networks:
  search_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  consul:
    image: hashicorp/consul:1.19
    container_name: designb_consul
    networks:
      search_net:
        ipv4_address: 172.28.0.2
    ports:
      - "8500:8500"
    command: agent -dev -client=0.0.0.0

  nginx-gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    container_name: designb_gateway
    networks:
      search_net:
        ipv4_address: 172.28.0.3
    ports:
      - "8080:80"
    environment:
      CONSUL_HTTP_ADDR: 172.28.0.2:8500
      NGINX_PORT: "80"
    depends_on:
      - consul

  worker-1:
    build:
      context: ../..
      dockerfile: worker/Dockerfile
    container_name: designb_worker_1
    networks:
      search_net:
        ipv4_address: 172.28.0.11
    ports:
      - "7001:7000"
      - "15701:5701"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORKER_ID: worker-1
      HOST_NAME: local-w1
      HOST_IP: 172.28.0.11
      PORT: "7000"
      DESIGN_MODE: design-b
      WORKER_ROLES: ingest,index,search
      CRAWL_THREADS: ${CRAWL_THREADS:-2}
      INDEX_THREADS: ${INDEX_THREADS:-2}
      CONSUL_ENABLED: "true"
      CONSUL_URL: http://172.28.0.2:8500
      HAZELCAST_CLUSTER_NAME: search-cluster
      HAZELCAST_PORT: "5701"
      HAZELCAST_JOIN_MODE: tcpip
      HAZELCAST_MEMBERS: 172.28.0.11:5701,172.28.0.12:5701,172.28.0.13:5701
      HAZELCAST_BACKUP_COUNT: ${HAZELCAST_BACKUP_COUNT:-1}
      GUTENBERG_URL_TEMPLATE: ${GUTENBERG_URL_TEMPLATE:-http://host.docker.internal:8900/books/%d}
      LOG_DIR: /app/logs
      DATA_DIR: /app/data
    depends_on:
      - consul

  worker-2:
    build:
      context: ../..
      dockerfile: worker/Dockerfile
    container_name: designb_worker_2
    networks:
      search_net:
        ipv4_address: 172.28.0.12
    ports:
      - "7002:7000"
      - "15702:5701"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORKER_ID: worker-2
      HOST_NAME: local-w2
      HOST_IP: 172.28.0.12
      PORT: "7000"
      DESIGN_MODE: design-b
      WORKER_ROLES: ingest,index,search
      CRAWL_THREADS: ${CRAWL_THREADS:-2}
      INDEX_THREADS: ${INDEX_THREADS:-2}
      CONSUL_ENABLED: "true"
      CONSUL_URL: http://172.28.0.2:8500
      HAZELCAST_CLUSTER_NAME: search-cluster
      HAZELCAST_PORT: "5701"
      HAZELCAST_JOIN_MODE: tcpip
      HAZELCAST_MEMBERS: 172.28.0.11:5701,172.28.0.12:5701,172.28.0.13:5701
      HAZELCAST_BACKUP_COUNT: ${HAZELCAST_BACKUP_COUNT:-1}
      GUTENBERG_URL_TEMPLATE: ${GUTENBERG_URL_TEMPLATE:-http://host.docker.internal:8900/books/%d}
      LOG_DIR: /app/logs
      DATA_DIR: /app/data
    depends_on:
      - consul

  worker-3:
    build:
      context: ../..
      dockerfile: worker/Dockerfile
    container_name: designb_worker_3
    networks:
      search_net:
        ipv4_address: 172.28.0.13
    ports:
      - "7003:7000"
      - "15703:5701"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORKER_ID: worker-3
      HOST_NAME: local-w3
      HOST_IP: 172.28.0.13
      PORT: "7000"
      DESIGN_MODE: design-b
      WORKER_ROLES: ingest,index,search
      CRAWL_THREADS: ${CRAWL_THREADS:-2}
      INDEX_THREADS: ${INDEX_THREADS:-2}
      CONSUL_ENABLED: "true"
      CONSUL_URL: http://172.28.0.2:8500
      HAZELCAST_CLUSTER_NAME: search-cluster
      HAZELCAST_PORT: "5701"
      HAZELCAST_JOIN_MODE: tcpip
      HAZELCAST_MEMBERS: 172.28.0.11:5701,172.28.0.12:5701,172.28.0.13:5701
      HAZELCAST_BACKUP_COUNT: ${HAZELCAST_BACKUP_COUNT:-1}
      GUTENBERG_URL_TEMPLATE: ${GUTENBERG_URL_TEMPLATE:-http://host.docker.internal:8900/books/%d}
      LOG_DIR: /app/logs
      DATA_DIR: /app/data
    depends_on:
      - consul

  management-center:
    image: hazelcast/management-center:5.5
    container_name: designb_mc
    profiles: ["mc"]
    networks:
      search_net:
        ipv4_address: 172.28.0.20
    ports:
      - "8081:8080"
    environment:
      MC_DEFAULT_CLUSTER: search-cluster
      MC_DEFAULT_CLUSTER_MEMBERS: 172.28.0.11:5701,172.28.0.12:5701,172.28.0.13:5701
