# Local single-machine development & smoke-test stack for Design A (Complete Local SQLite Copies).
# NOTE: Running multiple containers on one host is for functional smoke testing only;
# cluster benchmarks and fault-tolerance evaluations must use separate physical lab hosts
# via docker-compose.lab-infra.yml + docker-compose.lab-worker.yml (or run_worker.sh).

services:
  consul:
    image: hashicorp/consul:1.19
    container_name: designa_consul
    ports:
      - "8500:8500"
    command: agent -dev -client=0.0.0.0

  nginx-gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    container_name: designa_gateway
    ports:
      - "8080:80"
    environment:
      CONSUL_HTTP_ADDR: consul:8500
      NGINX_PORT: "80"
    depends_on:
      - consul

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: designa_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: designa_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker-1:
    build:
      context: ../..
      dockerfile: worker/Dockerfile
    container_name: designa_worker_1
    ports:
      - "7001:7000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORKER_ID: worker-1
      HOST_NAME: local-w1
      HOST_IP: worker-1
      PORT: "7000"
      DESIGN_MODE: design-a
      WORKER_ROLES: ingest,index,search
      CRAWL_THREADS: ${CRAWL_THREADS:-2}
      INDEX_THREADS: ${INDEX_THREADS:-2}
      CONSUL_ENABLED: "true"
      CONSUL_URL: http://consul:8500
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      PUBLISH_INTERVAL_MS: ${PUBLISH_INTERVAL_MS:-1000}
      GUTENBERG_URL_TEMPLATE: ${GUTENBERG_URL_TEMPLATE:-http://host.docker.internal:8900/books/%d}
      LOG_DIR: /app/logs
      DATA_DIR: /app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      consul:
        condition: service_started

  worker-2:
    build:
      context: ../..
      dockerfile: worker/Dockerfile
    container_name: designa_worker_2
    ports:
      - "7002:7000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORKER_ID: worker-2
      HOST_NAME: local-w2
      HOST_IP: worker-2
      PORT: "7000"
      DESIGN_MODE: design-a
      WORKER_ROLES: ingest,index,search
      CRAWL_THREADS: ${CRAWL_THREADS:-2}
      INDEX_THREADS: ${INDEX_THREADS:-2}
      CONSUL_ENABLED: "true"
      CONSUL_URL: http://consul:8500
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      PUBLISH_INTERVAL_MS: ${PUBLISH_INTERVAL_MS:-1000}
      GUTENBERG_URL_TEMPLATE: ${GUTENBERG_URL_TEMPLATE:-http://host.docker.internal:8900/books/%d}
      LOG_DIR: /app/logs
      DATA_DIR: /app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      consul:
        condition: service_started

  worker-3:
    build:
      context: ../..
      dockerfile: worker/Dockerfile
    container_name: designa_worker_3
    ports:
      - "7003:7000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORKER_ID: worker-3
      HOST_NAME: local-w3
      HOST_IP: worker-3
      PORT: "7000"
      DESIGN_MODE: design-a
      WORKER_ROLES: ingest,index,search
      CRAWL_THREADS: ${CRAWL_THREADS:-2}
      INDEX_THREADS: ${INDEX_THREADS:-2}
      CONSUL_ENABLED: "true"
      CONSUL_URL: http://consul:8500
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      PUBLISH_INTERVAL_MS: ${PUBLISH_INTERVAL_MS:-1000}
      GUTENBERG_URL_TEMPLATE: ${GUTENBERG_URL_TEMPLATE:-http://host.docker.internal:8900/books/%d}
      LOG_DIR: /app/logs
      DATA_DIR: /app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      consul:
        condition: service_started
